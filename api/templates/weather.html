{% extends 'base.html' %}

{% block metadata %}
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta charset="UTF-8">
    <meta property="og:title" content="Weather - {{ server_name }}">
    <meta property="og:site_name" content="▷">
    <meta property="og:url" content="https://{{ server_name }}/weather">
    <meta property="og:description" content="Live global weather visualization">
    <meta property="og:type" content=product>
    <meta property="og:image" content="https://{{ server_name }}/static/images/logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1">
{% endblock %}

{% block title %}▷ Weather{% endblock %}

{% block extra_scripts %}
<script>
document.addEventListener('DOMContentLoaded', () => {
  // Direct visits use the same fullscreen view as the navigation menu.
  const modal = document.getElementById('weatherModal');
  document.getElementById('weatherIframe').src = 'https://earth.nullschool.net/#current/wind/surface/level/overlay=temp/orthographic=16.78,46.84,2310/loc=24.738,42.213';
  modal.addEventListener('hidden.bs.modal', () => {
    window.location.assign('/');
  }, { once: true });
  bootstrap.Modal.getOrCreateInstance(modal).show();
});
</script>
{% endblock %}
