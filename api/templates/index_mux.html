{% extends 'base.html' %}

{% block metadata %}
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="expires" content="0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta charset="UTF-8">
    <meta property="og:title" content="{{ server_name }}">
    <meta property="og:site_name" content="▷">
    <meta property="og:url" content="https://{{ server_name }}">
    <meta property="og:description" content="The landing page of the flaxnet">
    <meta property="og:type" content=product>
    <meta property="og:image" content="https://{{ server_name }}/static/images/logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1">
{% endblock %}

{% block title %}▷ Stream{% endblock %}

{% block extra_head %}
    <link rel="stylesheet" href="/static/css/sheep.css">
{% endblock %}

{% block content %}
<!-- Live Stream - Public Access -->
<div class="content-container bg-dark text-white">
  <div id="stream" class="container-fluid p-3 bg-dark text-white">
    <div class="row">
      <div class="col-md-1 d-none d-md-block">
      </div>
      <div class="col-12 col-lg-10">
          <div class="content">
              <div id="stream-media" class="sheep-surface">
              <video controls crossorigin playsinline poster="static/images/poster.png">
                <track kind="captions" srclang="en" label="Decorative empty captions" src="/static/empty.vtt" default>
              </video>
              <img id="audio-only-poster" src="/static/images/derks24-ostfriesland.jpg" alt="Audio Only" style="display:none; width:100%; border-radius:4px;">
              </div>
              <div class="d-flex justify-content-between align-items-center mt-1 mb-2">
                <p class="mb-0 violet text-truncate flex-grow-1 me-2" id="epg-now-playing" style="display:none; min-width:0;">
                  <i class="fa fa-play-circle" aria-hidden="true"></i> <span id="epg-now-name"></span>
                </p>
                <p class="mb-0 violet text-nowrap flex-shrink-0"><span id="visitor-number">-</span> <i class="fa fa-eye" aria-hidden="true"></i></p>
              </div>
              <div class="d-flex flex-column flex-md-row justify-content-md-between align-items-start">
                <div id="epg-schedule" class="order-2 order-md-1 flex-grow-1">
                  <p class="text-secondary"><i class="fa fa-calendar" aria-hidden="true"></i> Loading schedule...</p>
                </div>
                <div class="order-1 order-md-2 d-flex flex-wrap gap-2 mb-2 mb-md-0 ms-md-3">
                  <div class="dropdown d-inline-block">
                    <button class="btn btn-sm btn-outline-secondary sheep-surface stream-link dropdown-toggle" type="button" id="stream-dropdown" data-bs-toggle="dropdown" aria-expanded="false">
                      <i class="fa fa-broadcast-tower"></i> streams
                    </button>
                    <ul class="dropdown-menu dropdown-menu-dark sheep-surface border border-secondary py-1" style="--bs-dropdown-min-width: 100%;" aria-labelledby="stream-dropdown">
                      <li><a class="dropdown-item stream-dropdown-item small py-1 px-2" href="/live/stream.m3u8" target="_blank" rel="noopener"><i class="fa fa-video me-1" aria-hidden="true"></i> video</a></li>
                      <li><a class="dropdown-item stream-dropdown-item small py-1 px-2" href="/live/audio.m3u8" target="_blank" rel="noopener"><i class="fa fa-headphones me-1" aria-hidden="true"></i> audio</a></li>
                    </ul>
                  </div>
                  <button type="button" id="sheep-btn" class="btn btn-sm btn-outline-secondary sheep-surface" title="Toggle Sheepy">
                    <i class="fa fa-paw"></i> sheepy
                  </button>
                  <button type="button" id="audio-poster-choose-btn" class="btn btn-sm btn-outline-secondary sheep-surface" title="Choose local audio-only poster" hidden>
                    <i class="fa fa-image"></i> poster
                  </button>
                  <button type="button" id="audio-poster-reset-btn" class="btn btn-sm btn-outline-secondary sheep-surface" title="Reset audio-only poster" hidden>
                    <i class="fa fa-rotate-left"></i> reset
                  </button>
                  <button type="button" id="audio-only-btn" class="btn btn-sm btn-outline-secondary sheep-surface" title="Toggle video">
                    <i class="fa fa-headphones"></i> audio only
                  </button>
                  <input type="file" id="audio-poster-input" class="visually-hidden" accept="image/*" tabindex="-1" aria-hidden="true">
                 </div>
               </div>
           </div>
               </div>
      </div>
      <div class="col-md-1 d-none d-md-block">
      </div>
    </div>
  </div>
</div>

<script src="/static/js/epg.js"></script>
<script src="/static/js/player.js"></script>
<script src="/static/js/sse.js"></script>
{% endblock %}

{% block extra_scripts %}
<script src="/static/js/sheep/action-catalog.js"></script>
<script src="/static/js/sheep/surface-planner.js"></script>
<script src="/static/js/sheep/runtime-engine.js"></script>
<script src="/static/js/sheep/presentation.js"></script>
<script src="/static/js/sheep.js"></script>
{% endblock %}
