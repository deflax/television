worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  types {
    application/vnd.apple.mpegurl m3u8;
    video/mp2t ts;
  }

  server {
    listen 80;
    server_name _;

    location = /health {
      default_type text/plain;
      return 200 'ok';
    }

    # Producer state contains source filenames and control markers. It is for
    # container-local diagnostics only, not the HLS client.
    location = /hls/status.json {
      return 404;
    }

    location ~* \.(tmp|request|json)$ {
      return 404;
    }

    location ~* \.m3u8$ {
      root /usr/share/nginx/html;
      try_files $uri =404;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Pragma "no-cache" always;
      expires -1;
    }

    location ~* \.ts$ {
      root /usr/share/nginx/html;
      try_files $uri =404;
      add_header Cache-Control "public, max-age=60, immutable" always;
      expires 60s;
    }

    location /hls/ {
      return 404;
    }

    location / {
      return 404;
    }
  }
}
